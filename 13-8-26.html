<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Fetch</title>
    <style>
        h1{
            text-align: center;
        }
        table{
            margin: auto;
            width: 80vw;
            padding: 10px;
            background-color: antiquewhite;
            color: brown;
            border: 2px solid blue;
        }
    </style>
        
</head>
<body>
    <h1 >List of Products</h1>
    <table>
        <thead>
           
                <th> S.no </th>
                <th> title </th>
                <th>Image</th>
                <th> Category </th>
                <th> Price </th>
                <th> Rating </th>
                <th> Stock </th>
        </thead>
        <tbody id="data"></tbody>
    </table>
    
</body>
<script>
            const URL = "https://dummyjson.com/products?limit=50&skip=20";
             async function loadProducts(){
                try{
                    const res=await fetch(URL);
                    console.log(res);
                    const data=await res.json();
                    console.log("DATA=",data.products);
                    let rows = "";
                    data.products.map((i,index)=>(
                        rows +=`
                        <tr>
                            <td> ${index+1}</td>
                            <td> ${i.title}</td>
                            <td> <img src=${i.images[0]} height="50" width="50"></td>
                            <td> ${i.category}</td>
                            <td> ${i.rating}</td>
                            <td> ₹${i.price}</td>
                            <td> ${i.stock}</td>
                            `
                            
                        ))
                        const el = document.getElementById("data");
                        el.innerHTML=rows;

                }
                catch(err){
                    console.log("Erroor=", err);
                }
            }
            loadProducts();
        </script>
</html>
